name: CD

# Deploys to the school Kubernetes cluster (vcluster etudiant-06) on every
# push to main. The site is static: the build output is pushed into a
# ConfigMap and the nginx deployment is restarted. No registry needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-etudiant-06
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the static site
        # The commit SHA is baked into the page footer, so the live site always
        # states exactly which commit it is running.
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.36.0"

      - name: Configure cluster credentials
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Publish the build into a ConfigMap
        # delete + create, NOT apply: `kubectl apply` embeds the whole object in
        # a last-applied-configuration annotation, and annotations cap at 256KB —
        # a JS bundle inside the ConfigMap would exceed that limit.
        run: |
          kubectl delete configmap landing-static --ignore-not-found
          kubectl create configmap landing-static --from-file=dist/

      - name: Apply manifests and roll out
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment/web
          kubectl rollout status deployment/web --timeout=120s

      - name: Record the deployment in rollout history
        # kubectl rollout history will now show WHICH commit each revision ran —
        # traceability inside the cluster itself, and the key to fast rollbacks.
        run: |
          kubectl annotate deployment web kubernetes.io/change-cause="deploy ${{ github.sha }} — v$(node -p "require('./package.json').version")" --overwrite

      - name: Smoke check the live site
        id: smoke
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://etudiant-06-web.development.atelier.ovh/ || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Site did not return 200 in time" && exit 1

      - name: Deployment summary
        if: always()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "## 🚀 Deployment report"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Version** | \`v${VERSION}\` |"
            echo "| **Commit** | [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| **Message** | ${{ github.event.head_commit.message || 'manual dispatch' }} |"
            echo "| **Live URL** | https://etudiant-06-web.development.atelier.ovh |"
            echo "| **Result** | ${{ job.status }} |"
            echo "| **Time (UTC)** | $(date -u '+%Y-%m-%d %H:%M:%S') |"
          } >> "$GITHUB_STEP_SUMMARY"
